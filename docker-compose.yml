services:
  config-server:
    build: .
    container_name: sanos-config-server
    restart: unless-stopped
    ports:
      # solo la maquina local: los demas servicios entran por la red de Docker
      - "127.0.0.1:8888:8888"
    # el healthcheck (HTTP contra /actuator/health) viene definido en el Dockerfile
    networks:
      - sanos-y-salvos-network
    environment:
      # vacio = servidor abierto (solo desarrollo local). Si se define, cada cliente debe llevar
      # SPRING_CLOUD_CONFIG_USERNAME y SPRING_CLOUD_CONFIG_PASSWORD con los mismos valores.
      CONFIG_SERVER_AUTH_USER: ${CONFIG_SERVER_AUTH_USER:-config}
      CONFIG_SERVER_AUTH_PASSWORD: ${CONFIG_SERVER_AUTH_PASSWORD:-}

networks:
  sanos-y-salvos-network:
    external: false
    name: sanos-y-salvos-network
