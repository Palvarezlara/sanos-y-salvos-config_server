spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

server:
  port: 8888

# Autenticacion basica de los clientes (SecurityConfig). Con CONFIG_SERVER_AUTH_PASSWORD vacio el
# servidor queda abierto (solo desarrollo local); en cualquier otro entorno debe definirse. Los clientes
# la mandan con SPRING_CLOUD_CONFIG_USERNAME / SPRING_CLOUD_CONFIG_PASSWORD.
config-server:
  auth:
    user: ${CONFIG_SERVER_AUTH_USER:config}
    password: ${CONFIG_SERVER_AUTH_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

info:
  application:
    name: config-server
    description: Servidor de configuraciones centralizado para Sanos y Salvos
    version: 0.0.1-SNAPSHOT
