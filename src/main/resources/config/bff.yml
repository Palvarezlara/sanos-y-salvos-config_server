# Configuración real del bff — mismo patrón que ms-mascotas y ms-alertas:
# el application.yml local del bff queda reducido a spring.application.name +
# spring.config.import, TODO lo demás vive acá.

server:
  port: ${PORT:8081}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://cognito-idp.${cognito.region}.amazonaws.com/${cognito.user-pool-id}/.well-known/jwks.json
          issuer-uri: https://cognito-idp.${cognito.region}.amazonaws.com/${cognito.user-pool-id}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

servicios:
  rutas:
    mascotas: ms-mascotas:8082 # nombre en eureka (puerto explicito: en docker el contenedor no escucha en :80)
    alertas: ms-alertas:8083
    usuarios: ms-usuarios
    contactos: ms-alertas:8083 # mismo microservicio que alertas

bff:
  retry-after: 5

cognito:
  region: ${COGNITO_REGION:us-east-1}
  user-pool-id: ${COGNITO_USER_POOL_ID}
  client-id: ${COGNITO_CLIENT_ID}
