# Configuración real del bff — mismo patrón que ms-mascotas y ms-alertas:
# el application.yml local del bff queda reducido a spring.application.name +
# spring.config.import, TODO lo demás vive acá.

server:
  port: ${PORT:8081}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://cognito-idp.${cognito.region}.amazonaws.com/${cognito.user-pool-id}/.well-known/jwks.json
          issuer-uri: https://cognito-idp.${cognito.region}.amazonaws.com/${cognito.user-pool-id}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}

servicios:
  rutas:
    mascotas: ms-mascotas:8082 # nombre en eureka (puerto explicito: en docker el contenedor no escucha en :80)
    alertas: ms-alertas:8083
    contactos: ms-alertas:8083 # mismo microservicio que alertas
    chat: ms-chat:8084 # REST del chat (historial, conversaciones); el WebSocket NO pasa por el bff, ver chat.ws-url

cognito:
  region: ${COGNITO_REGION:us-east-1}
  user-pool-id: ${COGNITO_USER_POOL_ID}
  client-id: ${COGNITO_CLIENT_ID}

# Ticket de un solo uso para abrir el WebSocket del chat directo contra ms-chat
# (POST /api/v1/chat/ticket). Sin secreto o sin URL el endpoint responde 503.
# Secreto de servicio: el bff lo manda junto con los headers de identidad (X-User-Id / X-User-Email) para que
# los microservicios, en especial ms-chat, confien en ellos. Vacio = no se manda.
internal:
  api-token: ${INTERNAL_API_TOKEN:}

chat:
  ticket-secret: ${CHAT_TICKET_SECRET:}
  ws-url: ${CHAT_WS_URL:}
