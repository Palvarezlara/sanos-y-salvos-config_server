server:
  port: 8761

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    register-with-eureka: false   # el servidor no se registra como cliente de sí mismo
    fetch-registry: false         # el servidor no consulta el registro
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Por defecto, valores de desarrollo (los servicios caidos desaparecen rapido del registro). En AWS
    # un microcorte no debe expulsar instancias sanas: definir EUREKA_SELF_PRESERVATION=true y los
    # demas tiempos (el umbral y el lease de los clientes tambien se pueden ajustar por entorno).
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:false}
    eviction-interval-timer-in-ms: ${EUREKA_EVICTION_INTERVAL_MS:5000}
    renewal-percent-threshold: ${EUREKA_RENEWAL_PERCENT_THRESHOLD:0.5}
    response-cache-update-interval-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

info:
  app:
    name: Eureka Discovery Server
    description: Sanos y Salvos Service Registry
    version: 1.0.0
