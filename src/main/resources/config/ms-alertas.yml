# Configuración real de ms-alertas — mismo patrón que el proyecto anterior
# (Ticketti/MS-FULLSTACK): el application.yml local del microservicio queda
# reducido a spring.application.name + spring.config.import; TODO lo demás
# vive acá.
#
# ms-alertas ya pasa DB_URL/DB_USER/DB_PASSWORD, MAIL_*, COGNITO_*,
# EUREKA_CLIENT_SERVICEURL_DEFAULTZONE y CONFIG_SERVER_URL como variables de
# entorno reales del contenedor (ver su docker-compose.yml) — ese mecanismo
# no cambia, solo se centraliza acá el mapeo de esas variables a properties
# de Spring.

server:
  port: ${PORT:8083}

spring:
  application:
    name: ms-alertas
  datasource:
    # sin valores por defecto: si falta el secreto el servicio debe fallar al arrancar, no entrar como root sin clave
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 'update' deja que la aplicacion modifique sola el esquema: valido en desarrollo; en AWS usar
      # JPA_DDL_AUTO=validate (o none) y migrar el esquema con Flyway/Liquibase
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.${cognito.region}.amazonaws.com/${cognito.user-pool-id}
          jwk-set-uri: https://cognito-idp.${cognito.region}.amazonaws.com/${cognito.user-pool-id}/.well-known/jwks.json
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    # desarrollo: 5 s / 15 s. En AWS usar EUREKA_LEASE_EXPIRATION=30 a 90 junto con la auto-preservacion
    lease-renewal-interval-in-seconds: ${EUREKA_LEASE_RENEWAL:5}
    lease-expiration-duration-in-seconds: ${EUREKA_LEASE_EXPIRATION:15}
    status-page-url-path: /actuator/health
    health-check-url-path: /actuator/health

cognito:
  region: ${COGNITO_REGION:us-east-1}
  user-pool-id: ${COGNITO_USER_POOL_ID}
  client-id: ${COGNITO_CLIENT_ID}

contacto:
  remitente: ${CONTACTO_REMITENTE:${spring.mail.username}}
  # limite de uso de POST /contactos (publico): intentos por ventana, por reporte y por correo de quien contacta
  limite:
    max-por-mascota: ${CONTACTO_MAX_POR_MASCOTA:10}
    max-por-correo: ${CONTACTO_MAX_POR_CORREO:5}
    ventana-minutos: ${CONTACTO_VENTANA_MINUTOS:60}

ms-mascotas:
  # sin valor por defecto: en un contenedor localhost apunta al propio servicio
  base-url: ${MS_MASCOTAS_BASE_URL}

# Secreto de servicio para /internal/** de ms-mascotas (header X-Internal-Token, minimo 32 caracteres)
internal:
  api-token: ${INTERNAL_API_TOKEN:}

frontend:
  url: ${FRONTEND_URL}

# Mensajeria SNS/SQS (en local, LocalStack: AWS_ENDPOINT_OVERRIDE)
aws:
  region: ${AWS_REGION}
  endpoint-override: ${AWS_ENDPOINT_OVERRIDE:}
  sns:
    topic-arn: ${AWS_SNS_TOPIC_ARN}

sqs:
  cola-contacto-url: ${SQS_COLA_CONTACTO_URL}
  cola-mascota-reportada-url: ${SQS_COLA_MASCOTA_REPORTADA_URL}
  cola-mascota-reunificada-url: ${SQS_COLA_MASCOTA_REUNIFICADA_URL}
  # las dos ultimas son opcionales: sin URL ese consumidor queda apagado y el servicio arranca igual
  cola-chat-aviso-url: ${SQS_COLA_CHAT_AVISO_URL:}
  cola-mascota-eliminada-url: ${SQS_COLA_MASCOTA_ELIMINADA_URL:}

# sin credenciales reales de Gmail el chequeo de salud del correo siempre
# falla y deja /actuator/health en DOWN aunque el resto funcione bien
management:
  health:
    mail:
      enabled: false
