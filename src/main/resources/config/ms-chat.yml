# Configuración real de ms-chat — mismo patrón que ms-mascotas y ms-alertas:
# el application.yml local del microservicio queda reducido a spring.application.name +
# spring.config.import; TODO lo demás vive acá.
#
# Los ${VAR} los resuelve ms-chat con el entorno de su propio contenedor (docker-compose).

server:
  port: ${PORT:8084}

spring:
  application:
    name: ms-chat
  mongodb:
    # base propia (una BD por microservicio): misma URI del cluster de Atlas, terminada en /sanos_chat
    uri: ${MONGODB_URI}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}
          jwk-set-uri: ${COGNITO_JWK_SET_URI}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: ${EUREKA_LEASE_RENEWAL:5}
    lease-expiration-duration-in-seconds: ${EUREKA_LEASE_EXPIRATION:15}
    status-page-url-path: /actuator/health
    health-check-url-path: /actuator/health

cognito:
  client-id: ${COGNITO_CLIENT_ID}

# Secreto de servicio para /internal/** de ms-mascotas (header X-Internal-Token, minimo 32 caracteres)
internal:
  api-token: ${INTERNAL_API_TOKEN:}

chat:
  # clave compartida con el bff para el ticket del WebSocket (mínimo 32 caracteres; sin ella se rechaza toda conexión)
  ticket-secret: ${CHAT_TICKET_SECRET:}
  # sin valor por defecto: el origen permitido depende del entorno (Vercel en AWS, localhost en desarrollo)
  allowed-origins: ${CHAT_ALLOWED_ORIGINS}
  # cuánto se conservan los mensajes: índice TTL en Mongo (privacidad, Ley 21.719)
  retencion: ${CHAT_RETENCION:90d}
  mascotas-base-url: ${MS_MASCOTAS_BASE_URL}
  # como máximo un aviso por correo cada tanto en una misma conversación (para no llenar la bandeja)
  aviso-intervalo: ${CHAT_AVISO_INTERVALO:30m}
  # limites de uso del REST (por usuario): peticiones por minuto y conversaciones nuevas por dia
  limite-rest-por-minuto: ${CHAT_LIMITE_REST_POR_MINUTO:60}
  limite-conversaciones-por-dia: ${CHAT_LIMITE_CONVERSACIONES_POR_DIA:20}
  # el ticket solo autoriza el apreton de manos: el socket se cierra a esta edad (el cliente reconecta con un
  # ticket nuevo) y si no llega ningun marco, ni ping, en este tiempo
  ws-vida-maxima-minutos: ${CHAT_WS_VIDA_MAXIMA_MINUTOS:30}
  ws-inactividad-segundos: ${CHAT_WS_INACTIVIDAD_SEGUNDOS:120}

# Reportes eliminados en ms-mascotas: ms-chat consume "mascota.eliminada" y borra sus conversaciones.
# Cola opcional: sin URL ese consumidor queda apagado y el chat arranca igual.
sqs:
  cola-mascota-eliminada-url: ${SQS_COLA_MASCOTA_ELIMINADA_URL:}

# Aviso de mensaje nuevo: ms-chat publica en el topic SNS y ms-alertas manda el correo.
# Sin topic configurado el chat funciona igual, solo sin avisos por correo.
aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-override: ${AWS_ENDPOINT_OVERRIDE:}
  sns:
    topic-arn: ${AWS_SNS_TOPIC_ARN:}

# el indicador de salud de Mongo consulta la base "local", donde el usuario de Atlas no tiene
# permiso (normal en Atlas): daba DOWN aunque la conexión real funcione (mismo caso que ms-mascotas)
management:
  health:
    mongo:
      enabled: false
    mongodb:
      enabled: false
